<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Irish International Student Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="js/vendor/tabler-icons/tabler-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div id="navbar"></div>

  <div class="container py-4">

    <div class="hero-banner">
      <div class="hero-eyebrow">Dashboard</div>
      <h1 id="welcomeHeading">Welcome back</h1>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <a href="expenses.html" class="hub-card d-block h-100 text-decoration-none">
          <div class="card-head">
            <span class="card-icon"><i class="ti ti-report-money"></i></span>
            <div>
              <div class="eyebrow">Money</div>
              <h2>Expense tracker</h2>
            </div>
          </div>
          <p class="muted mb-0">Log spending, set category budgets, and track savings goals.</p>
        </a>
      </div>

      <div class="col-md-6">
        <a href="bins.html" class="hub-card d-block h-100 text-decoration-none">
          <div class="card-head">
            <span class="card-icon"><i class="ti ti-recycle"></i></span>
            <div>
              <div class="eyebrow">Bins</div>
              <h2>Bin schedule</h2>
            </div>
          </div>
          <p class="muted mb-0">See your upcoming collections, colour-coded by bin type.</p>
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    Hub.requireAuth();
    Hub.renderNavbar("dashboard");

    const user = Hub.currentUser();
    if (user) {
      document.getElementById("welcomeHeading").textContent = `Welcome back, ${user.name.split(" ")[0]}`;
    }
  </script>
</body>
</html>
