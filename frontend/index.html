<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Irish International Student Hub - Log In</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="container">
  <div class="auth-card card p-4">
    <h3 class="mb-1 text-center">Irish International Student Hub</h3>
    <p class="text-muted text-center mb-4">Expenses &amp; bin collections, in one place.</p>

    <ul class="nav nav-tabs mb-3" id="authTabs">
      <li class="nav-item"><button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane">Log In</button></li>
      <li class="nav-item"><button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane">Register</button></li>
    </ul>

    <div id="alertBox" class="alert alert-danger d-none"></div>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="login-pane">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="loginEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="loginPassword" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>
      </div>

      <div class="tab-pane fade" id="register-pane">
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="regName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="regEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="regPassword" minlength="8" required>
            <div class="form-text">At least 8 characters.</div>
          </div>
          <button type="submit" class="btn btn-success w-100">Create Account</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
function showError(msg) {
  const box = document.getElementById("alertBox");
  box.textContent = msg;
  box.classList.remove("d-none");
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const data = await apiFetch("/auth/login", {
      method: "POST",
      body: JSON.stringify({
        email: document.getElementById("loginEmail").value,
        password: document.getElementById("loginPassword").value,
      }),
    });
    setToken(data.access_token);
    window.location.href = "dashboard.html";
  } catch (err) {
    showError(err.message);
  }
});

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await apiFetch("/auth/register", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("regName").value,
        email: document.getElementById("regEmail").value,
        password: document.getElementById("regPassword").value,
      }),
    });
    document.getElementById("login-tab").click();
    showError("Account created - you can log in now.");
    document.getElementById("alertBox").classList.replace("alert-danger", "alert-success");
  } catch (err) {
    showError(err.message);
  }
});
</script>
</body>
</html>
