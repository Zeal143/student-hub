<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses - Irish International Student Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="js/vendor/tabler-icons/tabler-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div id="navbar"></div>

  <div class="container py-4">
    <h1 class="page-title">Expense tracker</h1>
    <p class="page-subtitle">Log spending, keep an eye on category budgets, and track progress towards your savings goals.</p>

    <div class="hub-card mb-3">
      <div class="card-head">
        <span class="card-icon"><i class="ti ti-plus"></i></span>
        <h2>Add expense</h2>
      </div>
      <form id="expenseForm" class="row g-2 align-items-end">
        <div class="col-md-2 col-6">
          <label class="form-label">Amount (&euro;)</label>
          <input type="number" step="0.01" min="0.01" class="form-control" id="expAmount" placeholder="0.00" required>
        </div>
        <div class="col-md-2 col-6">
          <label class="form-label">Category</label>
          <select class="form-select" id="expCategory" required></select>
        </div>
        <div class="col-md-2 col-6">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" id="expDate" required>
        </div>
        <div class="col-md-4 col-6">
          <label class="form-label">Description</label>
          <input type="text" class="form-control" id="expDescription" placeholder="e.g. Weekly shop">
        </div>
        <div class="col-md-2 col-12">
          <button type="submit" class="btn btn-hub w-100">Add expense</button>
        </div>
      </form>
      <div id="expenseError" class="alert alert-danger py-2 small mt-2 d-none"></div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="hub-card">
          <div class="card-head">
            <span class="card-icon"><i class="ti ti-list"></i></span>
            <h2>Recent expenses</h2>
          </div>
          <div class="table-responsive">
            <table class="table table-sm align-middle">
              <thead>
                <tr>
                  <th>Date</th><th>Category</th><th>Description</th><th class="text-end">Amount</th><th></th>
                </tr>
              </thead>
              <tbody id="expenseTableBody"></tbody>
            </table>
          </div>
          <div id="expenseEmpty" class="empty-hint d-none">No expenses recorded yet. Add your first one above.</div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="row g-3">
          <div class="col-12">
            <div class="hub-card">
              <div class="card-head">
                <span class="card-icon"><i class="ti ti-chart-bar"></i></span>
                <h2>Spending over the last 4 weeks</h2>
              </div>
              <div class="chart-box-sm">
                <canvas id="weeklyChart"></canvas>
              </div>
            </div>
          </div>

          <div class="col-12">
            <div class="hub-card">
              <div class="card-head">
                <span class="card-icon"><i class="ti ti-report-money"></i></span>
                <h2>Category budgets</h2>
              </div>
              <form id="budgetForm" class="row g-2 align-items-end">
                <div class="col-6">
                  <select class="form-select form-select-sm" id="budgetCategory"></select>
                </div>
                <div class="col-4">
                  <input type="number" step="1" min="1" class="form-control form-control-sm" id="budgetAmount" placeholder="Limit (&euro;)">
                </div>
                <div class="col-2">
                  <button type="submit" class="btn btn-hub-outline btn-sm w-100">Save</button>
                </div>
              </form>
              <div id="budgetSummary" class="mt-3"></div>
            </div>
          </div>

          <div class="col-12">
            <div class="hub-card">
              <div class="card-head">
                <span class="card-icon"><i class="ti ti-target-arrow"></i></span>
                <h2>Savings goals</h2>
              </div>
              <form id="goalForm" class="row g-2 mb-3">
                <div class="col-12">
                  <input type="text" class="form-control form-control-sm" id="goalName" placeholder="Goal name, e.g. Summer trip" required>
                </div>
                <div class="col-6">
                  <input type="number" step="0.01" min="0.01" class="form-control form-control-sm" id="goalTarget" placeholder="Target (&euro;)" required>
                </div>
                <div class="col-6">
                  <button type="submit" class="btn btn-hub-outline btn-sm w-100">Add goal</button>
                </div>
              </form>
              <div id="goalsList"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/vendor/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    Hub.requireAuth();
    Hub.renderNavbar("expenses");

    let categories = [];
    let weeklyChart;

    async function loadCategories() {
      categories = await Hub.getCategories();
      const catOptions = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
      document.getElementById("expCategory").innerHTML = catOptions;
      document.getElementById("budgetCategory").innerHTML = catOptions;
    }

    async function renderExpenseTable() {
      const expenses = await Hub.getExpenses();
      const body = document.getElementById("expenseTableBody");
      const empty = document.getElementById("expenseEmpty");
      if (expenses.length === 0) {
        body.innerHTML = "";
        empty.classList.remove("d-none");
      } else {
        empty.classList.add("d-none");
        body.innerHTML = expenses.map(e => `
          <tr>
            <td class="small">${e.date}</td>
            <td class="small">${e.category_name}</td>
            <td class="small">${e.description || ""}</td>
            <td class="small text-end">&euro;${e.amount.toFixed(2)}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-link text-danger p-0" title="Delete" onclick="removeExpense(${e.id})">
                <i class="ti ti-trash" style="font-size:16px;"></i>
              </button>
            </td>
          </tr>`).join("");
      }

      const { labels, totals } = Hub.spendingByWeekFrom(expenses, 4);
      // Wrapped in try/catch so a Chart.js failure can't take down the rest
      // of the page's startup sequence (see initPage's Promise.all below).
      try {
        // Chart.js doesn't update in place when re-created on the same
        // <canvas> - destroy the old chart first or it renders on top of itself.
        if (weeklyChart) weeklyChart.destroy();
        weeklyChart = new Chart(document.getElementById("weeklyChart"), {
          type: "bar",
          data: { labels, datasets: [{ data: totals, backgroundColor: "#1F4D3A", borderRadius: 6 }] },
          options: {
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { callback: v => "\u20AC" + v } } }
          }
        });
      } catch (err) {
        console.error("Chart rendering failed:", err);
      }
    }

    async function removeExpense(id) {
      await Hub.deleteExpense(id);
      renderExpenseTable();
    }

    async function renderBudgets() {
      const budgets = await Hub.getBudgets();
      const box = document.getElementById("budgetSummary");
      box.innerHTML = budgets.length ? budgets.map(b => {
        const pct = b.monthly_limit > 0 ? Math.min(100, Math.round((b.spent / b.monthly_limit) * 100)) : 0;
        return `
        <div class="mb-2">
          <div class="d-flex justify-content-between small mb-1">
            <span>${b.category_name}</span>
            <span class="muted">&euro;${b.spent.toFixed(2)} / &euro;${b.monthly_limit.toFixed(2)}</span>
          </div>
          <div class="hub-progress"><div class="${Hub.budgetStatus(pct)}" style="width:${pct}%"></div></div>
        </div>`;
      }).join("") : '<p class="muted small mb-0">No budgets set yet.</p>';
    }

    async function renderGoals() {
      const goals = await Hub.getGoals();
      document.getElementById("goalsList").innerHTML = goals.length ? goals.map(g => `
        <div class="mb-2">
          <div class="d-flex justify-content-between small mb-1">
            <span>${g.name}</span>
            <span class="muted">&euro;${g.current_amount.toFixed(2)} / &euro;${g.target_amount.toFixed(2)}</span>
          </div>
          <div class="hub-progress mb-1"><div class="progress-ok" style="width:${g.progress_pct}%"></div></div>
          <div class="d-flex gap-1">
            <input type="number" step="0.01" class="form-control form-control-sm" style="max-width:110px" placeholder="Update saved (&euro;)" id="goalUpdate${g.id}">
            <button class="btn btn-sm btn-hub-outline" onclick="updateGoalAmount(${g.id})">Update</button>
            <button class="btn btn-sm btn-link text-danger" onclick="removeGoal(${g.id})"><i class="ti ti-trash" style="font-size:15px;"></i></button>
          </div>
        </div>`).join("") : '<p class="muted small mb-0">No savings goals yet.</p>';
    }

    async function updateGoalAmount(id) {
      const input = document.getElementById(`goalUpdate${id}`);
      const value = Number(input.value);
      if (!(value >= 0)) return;
      await Hub.updateGoal(id, { current_amount: value });
      renderGoals();
    }

    async function removeGoal(id) {
      await Hub.deleteGoal(id);
      renderGoals();
    }

    document.getElementById("expenseForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("expenseError");
      errorBox.classList.add("d-none");
      try {
        await Hub.addExpense({
          amount: document.getElementById("expAmount").value,
          category_id: Number(document.getElementById("expCategory").value),
          date: document.getElementById("expDate").value,
          description: document.getElementById("expDescription").value.trim()
        });
        e.target.reset();
        document.getElementById("expDate").value = new Date().toISOString().slice(0, 10);
        renderExpenseTable();
        renderBudgets();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("d-none");
      }
    });

    document.getElementById("budgetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await Hub.setBudget(
          Number(document.getElementById("budgetCategory").value),
          document.getElementById("budgetAmount").value
        );
        e.target.reset();
        renderBudgets();
      } catch (err) { alert(err.message); }
    });

    document.getElementById("goalForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await Hub.addGoal({
          name: document.getElementById("goalName").value.trim(),
          target_amount: document.getElementById("goalTarget").value
        });
        e.target.reset();
        renderGoals();
      } catch (err) { alert(err.message); }
    });

    (async function initPage() {
      document.getElementById("expDate").value = new Date().toISOString().slice(0, 10);
      await loadCategories();
      await Promise.all([renderExpenseTable(), renderBudgets(), renderGoals()]);
    })();
  </script>
</body>
</html>
