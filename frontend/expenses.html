<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expenses - Student Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container pb-5">
  <div class="row g-3">
    <div class="col-lg-5">
      <div class="card p-3 mb-3">
        <h6>Add Expense</h6>
        <form id="expenseForm">
          <div class="mb-2">
            <label class="form-label small">Amount (€)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="expAmount" required>
          </div>
          <div class="mb-2">
            <label class="form-label small">Category</label>
            <select class="form-select" id="expCategory" required></select>
          </div>
          <div class="mb-2">
            <label class="form-label small">Date</label>
            <input type="date" class="form-control" id="expDate" required>
          </div>
          <div class="mb-3">
            <label class="form-label small">Description</label>
            <input type="text" class="form-control" id="expDesc" maxlength="255">
          </div>
          <button class="btn btn-primary w-100" type="submit">Add Expense</button>
        </form>
      </div>

      <div class="card p-3 mb-3">
        <h6>Set a Monthly Budget</h6>
        <form id="budgetForm">
          <div class="mb-2">
            <select class="form-select" id="budgetCategory" required></select>
          </div>
          <div class="mb-2">
            <input type="number" step="0.01" min="0.01" class="form-control" id="budgetAmount" placeholder="Monthly limit (€)" required>
          </div>
          <button class="btn btn-outline-primary w-100" type="submit">Save Budget</button>
        </form>
      </div>

      <div class="card p-3">
        <h6>Savings Goals</h6>
        <form id="goalForm" class="mb-3">
          <div class="mb-2"><input type="text" class="form-control" id="goalName" placeholder="Goal name" required></div>
          <div class="mb-2"><input type="number" step="0.01" min="0.01" class="form-control" id="goalTarget" placeholder="Target amount (€)" required></div>
          <button class="btn btn-outline-success w-100" type="submit">Add Goal</button>
        </form>
        <div id="goalsList"></div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card p-3">
        <h6>Your Expenses</h6>
        <table class="table table-sm align-middle">
          <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="text-end">Amount</th><th></th></tr></thead>
          <tbody id="expenseTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script>
requireAuthOrRedirect();
renderNavbar("expenses.html");

let categories = [];

async function loadCategories() {
  // Categories are seeded server-side; simplest is a fixed list matching seed_data.py.
  categories = ["Rent", "Groceries", "Transport", "Utilities", "Entertainment", "Health", "Education", "Other"];
  // In production, expose a GET /api/categories endpoint instead of hardcoding.
}

async function loadExpenses() {
  const expenses = await apiFetch("/expenses");
  const tbody = document.getElementById("expenseTableBody");
  tbody.innerHTML = expenses.map(e => `
    <tr>
      <td>${e.date}</td>
      <td>${e.category_name}</td>
      <td>${e.description || ""}</td>
      <td class="text-end">€${e.amount.toFixed(2)}</td>
      <td><button class="btn btn-sm btn-outline-danger" onclick="deleteExpense(${e.id})">✕</button></td>
    </tr>`).join("");
}

async function deleteExpense(id) {
  if (!confirm("Delete this expense?")) return;
  await apiFetch(`/expenses/${id}`, { method: "DELETE" });
  loadExpenses();
}

async function loadBudgets() {
  const budgets = await apiFetch("/budgets");
  // simple refresh handled implicitly next dashboard visit
}

async function loadGoals() {
  const goals = await apiFetch("/savings");
  document.getElementById("goalsList").innerHTML = goals.map(g => `
    <div class="mb-2">
      <div class="d-flex justify-content-between small">
        <span>${g.name}</span><span>€${g.current_amount.toFixed(2)} / €${g.target_amount.toFixed(2)}</span>
      </div>
      <div class="progress"><div class="progress-bar bg-info" style="width:${g.progress_pct}%"></div></div>
    </div>`).join("") || `<p class="text-muted small mb-0">No savings goals yet.</p>`;
}

document.getElementById("expenseForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    // NOTE: category_id below assumes categories were seeded in the same
    // order as `categories`. Replace with a real GET /api/categories call.
    const idx = document.getElementById("expCategory").selectedIndex + 1;
    await apiFetch("/expenses", {
      method: "POST",
      body: JSON.stringify({
        amount: document.getElementById("expAmount").value,
        category_id: idx,
        date: document.getElementById("expDate").value,
        description: document.getElementById("expDesc").value,
      }),
    });
    e.target.reset();
    loadExpenses();
  } catch (err) { alert(err.message); }
});

document.getElementById("budgetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const idx = document.getElementById("budgetCategory").selectedIndex + 1;
    await apiFetch("/budgets", {
      method: "POST",
      body: JSON.stringify({
        category_id: idx,
        monthly_limit: document.getElementById("budgetAmount").value,
      }),
    });
    e.target.reset();
    alert("Budget saved. See it on your Dashboard.");
  } catch (err) { alert(err.message); }
});

document.getElementById("goalForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await apiFetch("/savings", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("goalName").value,
        target_amount: document.getElementById("goalTarget").value,
      }),
    });
    e.target.reset();
    loadGoals();
  } catch (err) { alert(err.message); }
});

(async function init() {
  await loadCategories();
  const catSelect = document.getElementById("expCategory");
  const budgetSelect = document.getElementById("budgetCategory");
  categories.forEach(c => {
    catSelect.innerHTML += `<option>${c}</option>`;
    budgetSelect.innerHTML += `<option>${c}</option>`;
  });
  document.getElementById("expDate").valueAsDate = new Date();
  loadExpenses();
  loadGoals();
})();
</script>
</body>
</html>
