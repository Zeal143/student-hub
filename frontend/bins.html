<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bin Schedule - Student Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container pb-5">
  <div class="row g-3">
    <div class="col-lg-5">
      <div class="card p-3">
        <h6>Your Address Details</h6>
        <div id="binAlert" class="alert alert-danger d-none"></div>
        <form id="binForm">
          <div class="mb-2">
            <label class="form-label small">Eircode</label>
            <input type="text" class="form-control" id="eircode" placeholder="e.g. D02 AF30" required>
          </div>
          <div class="mb-3">
            <label class="form-label small">Provider</label>
            <select class="form-select" id="providerSelect" required></select>
          </div>
          <button class="btn btn-primary w-100" type="submit">Save &amp; Look Up Schedule</button>
        </form>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card p-3">
        <h6>Upcoming Collections</h6>
        <div id="scheduleList"><p class="text-muted small">Enter your Eircode and provider to see your schedule.</p></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script>
requireAuthOrRedirect();
renderNavbar("bins.html");

async function loadProviders() {
  const providers = await apiFetch("/bins/providers");
  document.getElementById("providerSelect").innerHTML =
    providers.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
}

async function loadSchedule() {
  try {
    const schedule = await apiFetch("/bins/schedule");
    document.getElementById("scheduleList").innerHTML = schedule.map(s => `
      <div class="d-flex align-items-center mb-2 pb-2 border-bottom">
        <span class="bin-dot" style="background:${s.colour}"></span>
        <div>
          <div class="fw-bold text-capitalize">${s.bin_type} bin</div>
          <div class="small text-muted">${s.collection_date} · ${s.provider_name}</div>
        </div>
      </div>`).join("");
  } catch (err) {
    document.getElementById("scheduleList").innerHTML =
      `<p class="text-muted small">${err.message}</p>`;
  }
}

document.getElementById("binForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("binAlert");
  alertBox.classList.add("d-none");
  try {
    await apiFetch("/bins/settings", {
      method: "POST",
      body: JSON.stringify({
        eircode: document.getElementById("eircode").value,
        provider_id: document.getElementById("providerSelect").value,
      }),
    });
    loadSchedule();
  } catch (err) {
    alertBox.textContent = err.message;
    alertBox.classList.remove("d-none");
  }
});

(async function init() {
  await loadProviders();
  loadSchedule();
})();
</script>
</body>
</html>
